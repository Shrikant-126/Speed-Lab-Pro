<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SpeedLab Pro – advanced website performance analyzer with Core Web Vitals diagnostics and ready-to-use optimization code." />
    <meta name="theme-color" content="#4f46e5" />
    <title>SpeedLab Pro</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M18 5 8 18h7l-2 9 11-14h-7z' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Apply theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('speedlab-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
